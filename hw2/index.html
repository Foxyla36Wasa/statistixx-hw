<span data-t=pw></span> <input id=pw> <span data-t=path></span> <input id=path value="m/44'/60'/0'/0/0">

<canvas id=c1></canvas><canvas id=c2></canvas><canvas id=c3></canvas>
<pre id=st></pre>

<h3 data-t=notesH></h3>
<div data-t=notes></div>

<script>
const $ = id => document.getElementById(id)
const sub = crypto.subtle, enc = new TextEncoder()
const hex = b => [...b].map(v => v.toString(16).padStart(2, '0')).join('')
const num = b => BigInt('0x' + hex(b))
const be = n => Uint8Array.from(n.toString(16).padStart(64, '0').match(/../g), h => parseInt(h, 16))
const cat = (...a) => Uint8Array.from(a.flatMap(x => [...x]))
const bits = b => [...b].map(v => v.toString(2).padStart(8, '0')).join('')
const ones = b => bits(b).replace(/0/g, '').length
const sum = v => v.reduce((s, x) => s + x, 0)

const RHO = [0, 1, 62, 28, 27, 36, 44, 6, 55, 20, 3, 10, 43, 25, 39, 41, 45, 15, 21, 8, 18, 2, 61, 56, 14], RC = []
for (let r = 0, s = 1; r < 24; r++) {
  let c = 0n
  for (let j = 0; j < 7; j++) {
    if (s & 1) c |= 1n << BigInt(2 ** j - 1)
    s = s << 1 ^ (s & 128 ? 0x171 : 0)
  }
  RC.push(c)
}
const rot = (v, n) => (v << BigInt(n) | v >> BigInt(64 - n)) & 0xffffffffffffffffn

function keccak(msg, pad = 1) {
  const s = Array(25).fill(0n), m = [...msg, pad]
  while (m.length % 136) m.push(0)
  m[m.length - 1] |= 128
  for (let o = 0; o < m.length; o += 136) {
    for (let i = 0; i < 136; i++) s[i >> 3] ^= BigInt(m[o + i]) << BigInt(8 * (i & 7))
    for (let r = 0; r < 24; r++) {
      const C = [0, 1, 2, 3, 4].map(x => s[x] ^ s[x + 5] ^ s[x + 10] ^ s[x + 15] ^ s[x + 20]), B = []
      for (let i = 0; i < 25; i++) {
        const x = i % 5, y = (i - x) / 5
        B[y + 5 * ((2 * x + 3 * y) % 5)] = rot(s[i] ^ C[(x + 4) % 5] ^ rot(C[(x + 1) % 5], 1), RHO[i])
      }
      for (let i = 0; i < 25; i++) s[i] = B[i] ^ ~B[i - i % 5 + (i + 1) % 5] & B[i - i % 5 + (i + 2) % 5]
      s[0] ^= RC[r]
    }
  }
  return Uint8Array.from({length: 32}, (_, i) => Number(s[i >> 3] >> BigInt(8 * (i & 7)) & 255n))
}

const P = 2n ** 256n - 2n ** 32n - 977n
const N = 0xfffffffffffffffffffffffffffffffebaaedce6af48a03bbfd25e8cd0364141n
const G = [0x79be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798n,
           0x483ada7726a3c4655da4fbfc0e1108a8fd17b448a68554199c47d08ffb10d4b8n]
const md = (x, m = P) => (x % m + m) % m

function inv(x) {
  let [r, s, u, v] = [md(x), P, 1n, 0n]
  while (s) { const q = r / s; [r, s, u, v] = [s, r - q * s, v, u - q * v] }
  return md(u)
}

function add(A, B) {
  if (!A || !B) return A || B
  if (A[0] == B[0] && md(A[1] + B[1]) == 0n) return null
  const l = A[0] == B[0] ? md(3n * A[0] * A[0] * inv(2n * A[1])) : md((B[1] - A[1]) * inv(B[0] - A[0]))
  const x = md(l * l - A[0] - B[0])
  return [x, md(l * (A[0] - x) - A[1])]
}

const mul = k => [...k.toString(2)].reduce((R, bit) => bit == 1 ? add(add(R, R), G) : add(R, R), null)
const pub = Q => cat(be(Q[0]), be(Q[1]))

async function hmac(key, data) {
  const k = await sub.importKey('raw', key, {name: 'HMAC', hash: 'SHA-512'}, false, ['sign'])
  return new Uint8Array(await sub.sign('HMAC', k, data))
}

async function child([k, c], i) {
  let d = cat([0], be(k))
  if (i < 2 ** 31) { const Q = mul(k); d = cat([2 + Number(Q[1] & 1n)], be(Q[0])) }
  const I = await hmac(c, cat(d, [i >>> 24, i >> 16 & 255, i >> 8 & 255, i & 255]))
  return [md(num(I.slice(0, 32)) + k, N), I.slice(32)]
}

function eip55(a) {
  const h = hex(keccak(enc.encode(a)))
  return '0x' + [...a].map((c, i) => parseInt(h[i], 16) > 7 ? c.toUpperCase() : c).join('')
}

let lang = 'en'
try { lang = localStorage.getItem('lang') || 'en' } catch (e) {}
const tr = () => LOC[lang].hw2

function texts() {
  document.documentElement.lang = lang
  document.title = tr().title
  $('lang').value = lang
  document.querySelectorAll('[data-t]').forEach(e => e.innerHTML = tr()[e.dataset.t])
}

// output lines are kept as functions of the text, so they can be redrawn in the other language
let key, out = [], res
const paint = () => $('out').textContent = out.map(f => typeof f == 'function' ? f(tr()) : f).join('\n')
const log = f => { out.push(f); paint() }

async function run() {
  const ws = $('mn').value.trim().toLowerCase().split(/\s+/), path = $('path').value.trim()
  key = null; out = []
  if (!ws[0]) return log(t => t.empty)
  if (!/^m(\/\d+'?)*$/.test(path)) return log(t => t.badPath)
  log(t => t.s39)
  const pk = await sub.importKey('raw', enc.encode(ws.join(' ').normalize('NFKD')), 'PBKDF2', false, ['deriveBits'])
  const salt = enc.encode('mnemonic' + $('pw').value.normalize('NFKD'))
  const seed = new Uint8Array(await sub.deriveBits({name: 'PBKDF2', hash: 'SHA-512', salt, iterations: 2048}, pk, 512))
  log('  seed      ' + hex(seed))
  log(t => '            ' + t.pbkdf)
  log(t => t.s32)
  const I = await hmac(enc.encode('Bitcoin seed'), seed)
  let kc = [num(I.slice(0, 32)), I.slice(32)], name = 'm'
  log('  ' + name.padEnd(20) + hex(be(kc[0])))
  for (const s of path.split('/').slice(1)) {
    kc = await child(kc, parseInt(s) + (s.endsWith("'") ? 2 ** 31 : 0))
    name += '/' + s
    log('  ' + name.padEnd(20) + hex(be(kc[0])))
  }
  key = kc[0]
  const Q = mul(key), h = keccak(pub(Q)), ad = hex(h.slice(12))
  log(t => t.sSecp)
  log(t => '  ' + t.priv.padEnd(10) + hex(be(key)))
  log(t => '  ' + t.pub.padEnd(10) + '04 ' + hex(pub(Q)))
  log(t => t.sKeccak)
  log('  hash      ' + hex(h))
  log(t => '  ' + t.addr.padEnd(10) + '0x' + ad + '  ' + t.last20)
  log(t => t.sEip)
  log('            ' + eip55(ad))
  log('')
  log('Keccak-256("") = ' + hex(keccak([])))
  log(t => 'SHA3-256("")   = ' + hex(keccak([], 6)) + '  ' + t.sha3)
}

function bars(id, title, v, ref, top) {
  const c = $(id), g = c.getContext('2d'), H = c.height - 18, bw = c.width / v.length
  top = top || Math.max(...v, ...ref)
  g.clearRect(0, 0, c.width, c.height)
  g.font = '11px monospace'; g.fillStyle = '#000'; g.fillText(title, 3, 12)
  v.forEach((y, i) => g.fillRect(i * bw, c.height - y / top * H, Math.max(bw - 1, 1), y / top * H))
  g.strokeStyle = 'red'; g.beginPath()
  ref.forEach((y, i) => g.lineTo((i + .5) * bw, c.height - y / top * H))
  g.stroke()
}

function binom(m, tot) {
  const r = [tot / 2 ** m]
  for (let d = 0; d < m; d++) r.push(r[d] * (m - d) / (d + 1))
  return r
}

function stats() {
  if (!key) return
  const n = Math.max(2, Math.min(5000, +$('n').value || 300))
  const dig = Array(16).fill(0), dist = Array(161).fill(0), av = Array(257).fill(0)
  let Q = mul(key), prev, one = 0
  for (let i = 0; i < n; i++, Q = add(Q, G)) {
    const a = keccak(pub(Q)).slice(12)
    for (const c of hex(a)) dig[parseInt(c, 16)]++
    one += ones(a)
    if (prev) dist[ones(a.map((v, j) => v ^ prev[j]))]++
    prev = a
  }
  const x = pub(mul(key)), h = keccak(x)
  for (let i = 0; i < 512; i++) {
    const y = x.slice()
    y[i >> 3] ^= 1 << (i & 7)
    const hy = keccak(y)
    av[ones(h.map((v, j) => v ^ hy[j]))]++
  }
  res = {n, one, dig, dist, av}
  draw()
}

function draw() {
  if (!res) return
  const {n, one, dig, dist, av} = res, E = n * 40 / 16, mean = v => sum(v.map((c, d) => c * d)) / sum(v)
  bars('c1', tr().c1, dig, dig.map(() => E))
  bars('c2', tr().c2, dist, binom(160, n - 1))
  bars('c3', tr().c3, av, binom(256, 512))
  $('st').textContent = [
    tr().stOnes(n, (100 * one / n / 160).toFixed(2)),
    tr().stChi(sum(dig.map(o => (o - E) ** 2 / E)).toFixed(1)),
    tr().stCons(mean(dist).toFixed(1)),
    tr().stAval(mean(av).toFixed(1))
  ].join('\n')
}

$('lang').onchange = () => {
  lang = $('lang').value
  try { localStorage.setItem('lang', lang) } catch (e) {}
  texts(); paint(); draw()
}
// the downloaded page loads localisation.js from its own folder
$('dl').onclick = async () => {
  const save = (blob, name) => { const l = document.createElement('a'); l.href = URL.createObjectURL(blob); l.download = name; l.click() }
  const page = (await (await fetch(location.href)).text()).replace('../localisation.js', 'localisation.js')
  save(new Blob([page], {type: 'text/html'}), 'hw2.html')
  save(await (await fetch('../localisation.js')).blob(), 'localisation.js')
}

const go = () => run().then(() => setTimeout(stats, 50)).catch(e => { out = [t => t.error + e.message]; paint() })
for (const id of ['mn', 'pw', 'path']) $(id).onchange = go
$('run').onclick = go
$('sr').onclick = $('n').onchange = stats
texts()
go()
</script>
